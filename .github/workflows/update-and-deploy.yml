name: Update data and deploy

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC: NYT articles
    - cron: '0 7 1 * *' # 1st of the month 07:00 UTC: restaurant lists
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Weekly only: pull the latest NYT months, geocode new items, commit the data.
      - name: Refresh NYT data
        if: github.event_name != 'push' && github.event.schedule != '0 7 1 * *'
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: |
          npm run fetch:recent
          npm run build-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "Update 36 Hours data"
          git push

      # Monthly: look for NEW city guides on Eater / The Infatuation and fetch only those (saved guides are
      # not re-read). A failed fetch never overwrites saved data,
      # and the run is marked failed at the end (after deploying) so GitHub emails you.
      - name: Refresh restaurant lists
        id: food
        if: github.event.schedule == '0 7 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          npm run restaurants:update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "Update restaurant lists"
          git push

      - name: Build site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report restaurant refresh failure
        if: steps.food.outcome == 'failure'
        run: |
          echo "Restaurant list refresh failed; see the step above. The site was still deployed with the last saved data."
          exit 1
